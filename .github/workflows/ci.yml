name: Dharma Daily CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run linter static analysis
        run: flutter analyze

      - name: Run automated test suite (Panchang Math & Data Integrity)
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation
